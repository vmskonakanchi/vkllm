[project]
name = "vkllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
vkllm = "vkllm.server:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-v"
